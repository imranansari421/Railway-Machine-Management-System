<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gearNavyGrad" x1="50" y1="50" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4e96" />
      <stop offset="50%" stop-color="#0d2c68" />
      <stop offset="100%" stop-color="#071b42" />
    </linearGradient>

    <linearGradient id="gearGoldGrad" x1="320" y1="80" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="yellowArmGrad" x1="120" y1="120" x2="250" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="cabBodyGrad" x1="220" y1="120" x2="400" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="trackArcGrad" x1="60" y1="360" x2="450" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2e68" />
      <stop offset="70%" stop-color="#12408b" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="trackGoldGlow" x1="80" y1="350" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  {/* Outer Gear */}
  <path
    d="M 250,45 C 136.8,45 45,136.8 45,250 C 45,335.2 96.1,408.5 169.5,439.4 L 182,398 C 126.8,373.4 88,316.3 88,250 C 88,160.5 160.5,88 250,88 C 278.4,88 305.1,95.3 328.3,108.2 L 348.6,71.5 C 319.4,54.5 285.8,45 250,45 Z"
    fill="url(#gearNavyGrad)"
  />
  <path
    d="M 250,45 C 285.8,45 319.4,54.5 348.6,71.5 L 328.3,108.2 C 351.5,121.1 370.8,140.4 383.7,163.6 L 420.4,143.3 C 403.4,114.1 378.9,89.6 349.7,72.6 L 370,36 L 398,54 L 380,88 C 410.2,109 434.6,138.5 449.6,173.3 L 483,161 L 491,192 L 456,206 C 459.6,220.5 461.5,235.6 461.5,251 C 461.5,263 460.3,274.7 458,286 L 491,296 L 479,325 L 448,310 C 437.5,338.4 418.8,363.3 394,382 L 417,411 L 391,432 L 370,401 C 353,413 334,422 313,428 L 313,383 C 362.3,371.4 401.3,332.4 413,283.1 C 416.3,272.7 418,261.6 418,250 C 418,157.2 342.8,82 250,82 Z"
    fill="url(#gearGoldGrad)"
  />

  <circle cx="250" cy="250" r="162" fill="#ffffff" />

  {/* Sweeping Crescent */}
  <path
    d="M 50,285 C 42,350 90,418 165,448 C 240,478 335,475 425,435 C 355,455 260,450 190,425 C 120,400 75,350 72,295 Z"
    fill="url(#trackArcGrad)"
  />
  <path
    d="M 72,305 C 68,360 115,418 185,442 C 260,466 348,460 415,432 C 345,448 265,448 195,428 C 130,408 90,365 85,315 Z"
    fill="url(#trackGoldGlow)"
  />

  {/* Rails */}
  <path d="M 75,320 C 130,335 230,385 350,480" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
  <path d="M 155,330 C 230,360 340,410 460,490" stroke="#64748b" stroke-width="11" stroke-linecap="round" />

  {/* Track Machine */}
  <g id="TrackMachine" transform="translate(0, 10)">
    <path d="M 85,275 L 195,215 L 225,210 L 225,305 L 85,320 Z" fill="#0a2558" />
    <path d="M 92,270 L 190,218 L 190,248 L 92,298 Z" fill="#f59e0b" />

    {/* Arms */}
    <path d="M 160,205 L 245,160 L 260,180 L 180,230 Z" fill="url(#yellowArmGrad)" stroke="#0a2558" stroke-width="3.5" />
    <circle cx="252" cy="170" r="14" fill="#ca8a04" stroke="#0a2558" stroke-width="3.5" />
    <path d="M 245,175 L 220,295 L 200,290 L 230,170 Z" fill="url(#yellowArmGrad)" stroke="#0a2558" stroke-width="3.5" />

    {/* Cab */}
    <path d="M 215,190 L 285,145 L 305,145 L 300,295 L 215,295 Z" fill="url(#cabBodyGrad)" stroke="#0a2558" stroke-width="4" />
    <path d="M 285,145 L 340,110 L 400,140 L 305,145 Z" fill="#0d2c68" stroke="#0a2558" stroke-width="4" />
    <path d="M 305,145 L 400,140 L 450,230 L 455,305 L 300,295 Z" fill="#0d2c68" stroke="#0a2558" stroke-width="4" />

    {/* Windshield */}
    <path d="M 315,155 L 365,150 L 362,210 L 312,215 Z" fill="#38bdf8" stroke="#071b42" stroke-width="3" />
    <path d="M 375,149 L 418,144 L 435,200 L 372,209 Z" fill="#38bdf8" stroke="#071b42" stroke-width="3" />
    <path d="M 308,220 L 440,208 L 443,230 L 306,242 Z" fill="#f59e0b" stroke="#0a2558" stroke-width="2.5" />

    {/* Lights */}
    <circle cx="330" cy="265" r="14" fill="#ffffff" stroke="#0a2558" stroke-width="3.5" />
    <circle cx="435" cy="250" r="14" fill="#ffffff" stroke="#0a2558" stroke-width="3.5" />

    {/* Chevrons */}
    <path d="M 295,295 L 460,305 L 415,375 L 270,355 Z" fill="#f59e0b" stroke="#0a2558" stroke-width="4" />
    <circle cx="310" cy="380" r="14" fill="#1e293b" stroke="#0a2558" stroke-width="3" />
    <circle cx="370" cy="392" r="15" fill="#1e293b" stroke="#0a2558" stroke-width="3" />
  </g>
</svg>
